name: Pages API read-only smoke test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "HTTPS Pages deployment URL (use Preview first)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run read-only API smoke test
        env:
          PAGES_BASE_URL: ${{ inputs.base_url }}
        run: node scripts/smoke-pages-api.mjs
