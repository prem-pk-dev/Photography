name: Preview Admin CMS authenticated E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview-admin-cms-e2e
  cancel-in-progress: false

jobs:
  authenticated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PREVIEW_ADMIN_EMAIL: ${{ secrets.PREVIEW_ADMIN_EMAIL }}
      PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify authenticated Preview Admin and CMS read paths
        run: node scripts/test-preview-admin-e2e.mjs
